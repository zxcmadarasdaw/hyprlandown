# Hyprland (safe): минимальный конфиг для восстановления.
# Без плагинов, без Quickshell, без анимаций и эффектов.
# Не зависит от остальных файлов в hypr/ (никаких source).
# Это аварийное восстановление, а не игровой режим: механизмы разные (ТЗ 1.6, 2.4).

monitor = , preferred, auto, 1

input {
    kb_layout = us,ru
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
}

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 1
    layout = dwindle
}

decoration {
    rounding = 0
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = false
}

# Простые обои: сплошной цвет, без внешних программ.
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    background_color = rgb(101820)
}

$mainMod = SUPER

bind = $mainMod, RETURN, exec, kitty
bind = $mainMod, Q, killactive
bind = $mainMod, F, fullscreen
bind = $mainMod SHIFT, E, exit

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Уведомление о причине запуска safe-сессии (встроенное, без демона уведомлений).
# Через bash: git на Windows не хранит бит исполнения (core.filemode=false).
exec-once = bash ~/.config/hypr/scripts/safe-notify.sh
