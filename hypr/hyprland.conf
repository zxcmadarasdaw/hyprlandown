# Hyprland: главный конфиг (этап 1).
# Здесь только подключение частей. Сами настройки лежат в отдельных файлах.
# Проверка после запуска: hyprctl configerrors (должно быть пусто).

# Программы по умолчанию. Это заглушки: пакеты нужно поставить отдельно.
# Единый лаунчер появится на этапе 5.
# Переменные объявляются ДО source: keybinds.conf их использует, а конфиг
# читается сверху вниз.
$terminal = kitty
$menu = fuzzel

source = ~/.config/hypr/gpu.conf
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/appearance.conf
source = ~/.config/hypr/keybinds.conf

# Автозапуск. Quickshell добавится на этапе 2, обои на этапе 3.
# exec-once = quickshell
