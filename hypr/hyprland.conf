# Hyprland: главный конфиг (этап 1).
# Здесь только подключение частей. Сами настройки лежат в отдельных файлах.
# Проверка после запуска: hyprctl configerrors (должно быть пусто).

# Программы по умолчанию. Это заглушки: пакеты нужно поставить отдельно.
# Единый лаунчер появится на этапе 5.
# Переменные объявляются ДО source: keybinds.conf их использует, а конфиг
# читается сверху вниз.
$terminal = kitty
$menu = fuzzel
# Оболочка Quickshell (этапы 2-3): холст виджетов, панель, обои.
# Запуск, перезапуск и IPC идут через CLI проекта (hyprown): он сам находит
# shell.qml, не плодит дубликаты и пишет логи (docs/ARCHITECTURE.md).
# ~/.local/bin/hyprown ставит установщик; Preview подставляет абсолютный путь.
# Вызов IPC-функций оболочки (хоткеи в keybinds.conf).
$qsipc = ~/.local/bin/hyprown ipc

source = ~/.config/hypr/gpu.conf
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/appearance.conf
# Профиль производительности (Manager -> Performance). Файл создаёт установщик.
source = ~/.local/state/hyprdesk/performance.conf
source = ~/.config/hypr/keybinds.conf

# Автозапуск. Супервизор держит Quickshell (обои, холст виджетов, панель):
# один экземпляр, перезапуск после сбоя, независимость от терминала.
# Safe-сессия (hypr/safe) этот файл не читает: там Quickshell не запускается.
exec-once = ~/.local/bin/hyprown shell run
