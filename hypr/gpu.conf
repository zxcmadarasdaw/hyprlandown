# Настройки GPU (единый файл, этап 14 доработает его).

# Какая видеокарта: amd или nvidia. Эту строку читает Quickshell, чтобы выбрать
# аппаратный декодер для видео-обоев (amd -> vaapi, nvidia -> nvdec).
# Для Hyprland это просто переменная, ни на что не влияет.
$hyprdesk_gpu = amd

# По умолчанию AMD: дополнительных переменных не нужно.
# Для NVIDIA раскомментировать блок ниже (проверить на конкретной версии драйвера).

# env = LIBVA_DRIVER_NAME,nvidia
# env = __GLX_VENDOR_LIBRARY_NAME,nvidia
# env = NVD_BACKEND,direct
# env = GBM_BACKEND,nvidia-drm
