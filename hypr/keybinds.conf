# Горячие клавиши HyprlandOwn. ФАЙЛ СГЕНЕРИРОВАН из manifests/keybinds.toml:
# правьте реестр или переназначайте клавиши через `hyprown keys` / Manager,
# затем `hyprown keys render --write`. Переназначения пользователя лежат отдельно
# (~/.local/state/hyprdesk/keybinds.user.conf) и подключаются после этого файла.
$mainMod = SUPER

# Программы
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, SPACE, exec, $menu

# Окна
bind = $mainMod, Q, killactive
bind = $mainMod, F, fullscreen
bind = $mainMod, V, togglefloating
bind = $mainMod, P, pseudo
bind = $mainMod, J, togglesplit

# Выход из сессии. Штатный выход снимает маркер аварии (см. hypr/session).
bind = $mainMod SHIFT, E, exit

# Фокус
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Рабочие пространства
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Холст виджетов (этап 2)
bind = $mainMod, E, exec, $qsipc canvas toggleEdit
bind = $mainMod CTRL, 0, exec, $qsipc canvas resetCamera

# Перезапуск оболочки, если она зависла или упала
bind = $mainMod CTRL, R, exec, ~/.local/bin/hyprown shell restart

# Обои (этап 3): следующие / предыдущие / сетка превью
bind = $mainMod, W, exec, $qsipc wallpaper next
bind = $mainMod CTRL, W, exec, $qsipc wallpaper prev
bind = $mainMod SHIFT, W, exec, $qsipc wallpaper picker

# HyprlandOwn Manager: компоненты, зависимости, диагностика, восстановление
bind = $mainMod, M, exec, ~/.local/bin/hyprown manager

# Мышь: перетаскивание и размер окон
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
