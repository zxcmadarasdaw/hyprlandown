# Оформление: скругления, блюр, тени, встроенные анимации.
# Значения совпадают с docs/tokens.default.json (Aurora Glass).
# На этапе 4 этот файл будет генерироваться из токенов, а не правиться руками.

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(7aa2f7ee) rgba(bb9af7ee) 45deg
    col.inactive_border = rgba(2a3558aa)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 22

    blur {
        enabled = true
        size = 8
        passes = 3
    }

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(00000066)
    }
}

animations {
    enabled = true

    bezier = smoothOut, 0.16, 1, 0.3, 1

    animation = windows, 1, 4, smoothOut, popin 90%
    animation = fade, 1, 4, smoothOut
    animation = workspaces, 1, 4, smoothOut, slide
    animation = border, 1, 6, smoothOut
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}
