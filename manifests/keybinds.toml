# Единый реестр горячих клавиш HyprlandOwn.
#
# Источник истины: отсюда генерируется hypr/keybinds.conf (hyprown keys render --write),
# отсюда же берётся проверка конфликтов, живая сверка с `hyprctl binds` и редактор клавиш
# в Manager. Руками hypr/keybinds.conf не правим: тест сверяет файл с реестром.
#
# Поля записи:
#   id          стабильный идентификатор (на него ссылаются пользовательские переназначения)
#   title       подпись в редакторе
#   category    группа в редакторе и комментарий в конфиге
#   kind        bind (обычная) или bindm (мышь)
#   mods        SUPER, CTRL, ALT, SHIFT через пробел; SUPER в конфиге пишется как $mainMod
#   key         имя клавиши Hyprland (RETURN, SPACE, left, 1, mouse:272)
#   dispatcher  диспетчер Hyprland
#   arg         аргумент (может содержать $terminal, $menu, $qsipc из hypr/hyprland.conf)
#   keys        вместо key: список клавиш; в arg подставляется {k} (цифры рабочих пространств)
#   preview_mods / preview_key  замена только в Preview Mode (чужие глобальные клавиши KDE)
#   critical    true: клавиша аварийная (выход), её нельзя отключить без явного --force

schema = 1

[[bind]]
id = "terminal"
title = "Терминал"
category = "Программы"
mods = "SUPER"
key = "Q"
dispatcher = "exec"
arg = "$terminal"

# Alt+Space в Preview перехватывает KRunner/меню окна KDE, поэтому там лаунчер на Alt+R.
[[bind]]
id = "launcher"
title = "Лаунчер"
category = "Программы"
mods = "SUPER"
key = "SPACE"
dispatcher = "exec"
arg = "$menu"
preview_key = "R"

[[bind]]
id = "window.close"
title = "Закрыть окно"
category = "Окна"
mods = "SUPER"
key = "C"
dispatcher = "killactive"

[[bind]]
id = "window.fullscreen"
title = "Полный экран"
category = "Окна"
mods = "SUPER"
key = "F"
dispatcher = "fullscreen"

[[bind]]
id = "window.float"
title = "Плавающее окно"
category = "Окна"
mods = "SUPER"
key = "V"
dispatcher = "togglefloating"

[[bind]]
id = "window.pseudo"
title = "Псевдотайлинг"
category = "Окна"
mods = "SUPER"
key = "P"
dispatcher = "pseudo"

[[bind]]
id = "window.split"
title = "Смена направления деления"
category = "Окна"
mods = "SUPER"
key = "J"
dispatcher = "togglesplit"

[[bind]]
id = "session.exit"
title = "Выход из сессии"
category = "Выход из сессии. Штатный выход снимает маркер аварии (см. hypr/session)."
mods = "SUPER"
key = "M"
dispatcher = "exit"
critical = true

[[bind]]
id = "focus.left"
title = "Фокус влево"
category = "Фокус"
mods = "SUPER"
key = "left"
dispatcher = "movefocus"
arg = "l"

[[bind]]
id = "focus.right"
title = "Фокус вправо"
category = "Фокус"
mods = "SUPER"
key = "right"
dispatcher = "movefocus"
arg = "r"

[[bind]]
id = "focus.up"
title = "Фокус вверх"
category = "Фокус"
mods = "SUPER"
key = "up"
dispatcher = "movefocus"
arg = "u"

[[bind]]
id = "focus.down"
title = "Фокус вниз"
category = "Фокус"
mods = "SUPER"
key = "down"
dispatcher = "movefocus"
arg = "d"

[[bind]]
id = "workspace"
title = "Рабочее пространство {k}"
category = "Рабочие пространства"
mods = "SUPER"
keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]
dispatcher = "workspace"
arg = "{k}"

[[bind]]
id = "workspace.move"
title = "Окно на пространство {k}"
category = "Рабочие пространства"
mods = "SUPER SHIFT"
keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]
dispatcher = "movetoworkspace"
arg = "{k}"

[[bind]]
id = "canvas.edit"
title = "Холст виджетов: режим правки"
category = "Холст виджетов (этап 2)"
mods = "SUPER SHIFT"
key = "C"
dispatcher = "exec"
arg = "$qsipc canvas toggleEdit"

[[bind]]
id = "canvas.reset"
title = "Холст виджетов: сброс камеры"
category = "Холст виджетов (этап 2)"
mods = "SUPER CTRL"
key = "0"
dispatcher = "exec"
arg = "$qsipc canvas resetCamera"

[[bind]]
id = "shell.restart"
title = "Перезапуск оболочки"
category = "Перезапуск оболочки, если она зависла или упала"
mods = "SUPER CTRL"
key = "R"
dispatcher = "exec"
arg = "~/.local/bin/hyprown shell restart"

[[bind]]
id = "wallpaper.next"
title = "Обои: следующие"
category = "Обои (этап 3): следующие / предыдущие / сетка превью"
mods = "SUPER"
key = "W"
dispatcher = "exec"
arg = "$qsipc wallpaper next"

[[bind]]
id = "wallpaper.prev"
title = "Обои: предыдущие"
category = "Обои (этап 3): следующие / предыдущие / сетка превью"
mods = "SUPER CTRL"
key = "W"
dispatcher = "exec"
arg = "$qsipc wallpaper prev"

[[bind]]
id = "wallpaper.picker"
title = "Обои: сетка превью"
category = "Обои (этап 3): следующие / предыдущие / сетка превью"
mods = "SUPER SHIFT"
key = "W"
dispatcher = "exec"
arg = "$qsipc wallpaper picker"

# Раскладка как в стандартном конфиге Hyprland: Super+Q терминал, Super+C закрыть окно,
# Super+M выход, Super+E файловый менеджер. Manager живёт на Super+D.
[[bind]]
id = "theme.picker"
title = "Тема: выбор (готовые и из обоев)"
category = "Тема (этап 4): готовые темы и палитра из обоев"
mods = "CTRL ALT"
key = "F"
dispatcher = "exec"
arg = "$qsipc theme picker"

[[bind]]
id = "manager"
title = "HyprlandOwn Manager"
category = "HyprlandOwn Manager: компоненты, зависимости, диагностика, восстановление"
mods = "SUPER"
key = "D"
dispatcher = "exec"
arg = "~/.local/bin/hyprown manager"

[[bind]]
id = "filemanager"
title = "Файловый менеджер"
category = "Программы"
mods = "SUPER"
key = "E"
dispatcher = "exec"
arg = "$fileManager"

[[bind]]
id = "lock"
title = "Заблокировать экран"
category = "Программы"
mods = "SUPER"
key = "L"
dispatcher = "exec"
arg = "hyprlock"

[[bind]]
id = "screenshot"
title = "Скриншот области в буфер обмена"
category = "Программы"
key = "PRINT"
dispatcher = "exec"
arg = "sh -c 'grim -g \"$(slurp)\" - | wl-copy'"

[[bind]]
id = "window.fullscreen.keep"
title = "Развернуть окно (с панелью)"
category = "Окна"
mods = "SUPER SHIFT"
key = "F"
dispatcher = "fullscreen"
arg = "1"

[[bind]]
id = "window.move.left"
title = "Переместить окно влево"
category = "Окна"
mods = "SUPER SHIFT"
key = "left"
dispatcher = "movewindow"
arg = "l"

[[bind]]
id = "window.move.right"
title = "Переместить окно вправо"
category = "Окна"
mods = "SUPER SHIFT"
key = "right"
dispatcher = "movewindow"
arg = "r"

[[bind]]
id = "window.move.up"
title = "Переместить окно вверх"
category = "Окна"
mods = "SUPER SHIFT"
key = "up"
dispatcher = "movewindow"
arg = "u"

[[bind]]
id = "window.move.down"
title = "Переместить окно вниз"
category = "Окна"
mods = "SUPER SHIFT"
key = "down"
dispatcher = "movewindow"
arg = "d"

[[bind]]
id = "window.resize.left"
title = "Окно уже"
category = "Окна"
mods = "SUPER CTRL"
key = "left"
dispatcher = "resizeactive"
arg = "-40 0"

[[bind]]
id = "window.resize.right"
title = "Окно шире"
category = "Окна"
mods = "SUPER CTRL"
key = "right"
dispatcher = "resizeactive"
arg = "40 0"

[[bind]]
id = "window.resize.up"
title = "Окно ниже"
category = "Окна"
mods = "SUPER CTRL"
key = "up"
dispatcher = "resizeactive"
arg = "0 -40"

[[bind]]
id = "window.resize.down"
title = "Окно выше"
category = "Окна"
mods = "SUPER CTRL"
key = "down"
dispatcher = "resizeactive"
arg = "0 40"

[[bind]]
id = "workspace.next"
title = "Следующее рабочее пространство (колесо)"
category = "Рабочие пространства"
mods = "SUPER"
key = "mouse_down"
dispatcher = "workspace"
arg = "e+1"

[[bind]]
id = "workspace.prev"
title = "Предыдущее рабочее пространство (колесо)"
category = "Рабочие пространства"
mods = "SUPER"
key = "mouse_up"
dispatcher = "workspace"
arg = "e-1"

[[bind]]
id = "volume.up"
title = "Громкость выше"
category = "Мультимедиа"
key = "XF86AudioRaiseVolume"
dispatcher = "exec"
arg = "wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+"

[[bind]]
id = "volume.down"
title = "Громкость ниже"
category = "Мультимедиа"
key = "XF86AudioLowerVolume"
dispatcher = "exec"
arg = "wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-"

[[bind]]
id = "volume.mute"
title = "Выключить звук"
category = "Мультимедиа"
key = "XF86AudioMute"
dispatcher = "exec"
arg = "wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"

[[bind]]
id = "brightness.up"
title = "Яркость выше"
category = "Мультимедиа"
key = "XF86MonBrightnessUp"
dispatcher = "exec"
arg = "brightnessctl set 5%+"

[[bind]]
id = "brightness.down"
title = "Яркость ниже"
category = "Мультимедиа"
key = "XF86MonBrightnessDown"
dispatcher = "exec"
arg = "brightnessctl set 5%-"

[[bind]]
id = "mouse.move"
title = "Перетаскивание окна мышью"
category = "Мышь: перетаскивание и размер окон"
kind = "bindm"
mods = "SUPER"
key = "mouse:272"
dispatcher = "movewindow"

[[bind]]
id = "mouse.resize"
title = "Изменение размера окна мышью"
category = "Мышь: перетаскивание и размер окон"
kind = "bindm"
mods = "SUPER"
key = "mouse:273"
dispatcher = "resizewindow"
